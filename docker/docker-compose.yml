services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: telecom-assurance-app
    environment:
      SERVICE_API_KEY: development-only
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: telecom_db
      POSTGRES_USER: telecom_user
      POSTGRES_PASSWORD: telecom_password
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: telecom_knowledge_base
    ports:
      - "8000:8000"
    volumes:
      - ../data/runtime:/app/data/runtime
    depends_on:
      - postgres
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: telecom-qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./qdrant_data:/qdrant/storage

    restart: unless-stopped


  postgres:
    image: postgres:17
    container_name: telecom-postgres

    environment:
      POSTGRES_USER: telecom_user
      POSTGRES_PASSWORD: telecom_password
      POSTGRES_DB: telecom_db

    ports:
      - "5432:5432"

    volumes:
      - ./postgres_data:/var/lib/postgresql/data

    restart: unless-stopped
