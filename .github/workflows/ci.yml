name: Production readiness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.validate_scenarios --output reports/rca.json
      - run: docker build --tag telecom-assurance:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-rca-evaluation
          path: reports/rca.json
